# Tauri-shell. Bewust NIET in de core-workspace: bouwt alleen op een machine met de
# Tauri-vereisten (Windows: WebView2 + VS Build Tools). Zie VAULT/waves/W00-fundament.md.
[package]
name = "vortex-app"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
