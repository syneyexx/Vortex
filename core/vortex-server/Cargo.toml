[package]
name = "vortex-server"
description = "Kern-proces: eventstream naar GUI, opdrachten, lokale OpenAI-API en de `vortex` CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vortex"
path = "src/main.rs"

[features]
default = []
# tokio-console: `cargo run --features console` + RUSTFLAGS="--cfg tokio_unstable"
console = ["dep:console-subscriber"]
# Profiling met Tracy
tracy = ["vortex-core/tracy"]

[dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
vortex-types.workspace = true
vortex-core.workspace = true
vortex-proto.workspace = true
vortex-models.workspace = true
vortex-memory.workspace = true
vortex-tools.workspace = true
vortex-neural.workspace = true
vortex-crawler.workspace = true
vortex-context.workspace = true
vortex-cognition.workspace = true
vortex-agents.workspace = true
vortex-eval.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
mimalloc.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

futures.workspace = true
tonic.workspace = true
chrono.workspace = true
async-trait = "0.1"
parking_lot.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
tokio-util.workspace = true
console-subscriber = { version = "0.4", optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.24"

[lints]
workspace = true
