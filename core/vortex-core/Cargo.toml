[package]
name = "vortex-core"
description = "Runtime kern: runs, state machine, event log + outbox, cancellation, budgetten, checkpoints, config, secrets, supervisie, scheduler, crash-herstel."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vortex-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
parking_lot.workspace = true
notify.workspace = true
toml.workspace = true
chrono.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
core_affinity = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "sched"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
