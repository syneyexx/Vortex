# Wereldmonitor (W14). Zie VAULT/modules/research-kennis.md en core/vortex-server/src/world_api.rs.
# Elke bron: soort, URL (instelbaar), interval, land + richting (voor bronbias). Tempo en
# voorwaarden per soort staan in vortex-crawler::world::terms (zichtbaar in de GUI).

enabled = true
cluster_threshold = 0.34      # gelijkenis om artikelen tot één event samen te voegen
window_hours = 72             # clustervenster
hypothesize_every_hours = 6
predict_every_hours = 12
horizon_days = 30

