# ── Wereldwijde event-databases ──────────────────────────────────────────────
[[sources]]
name = "gdelt"
kind = "gdelt"
url = "https://api.gdeltproject.org/api/v2/doc/doc"
interval_min = 60
params = { query = "(sourcelang:english OR sourcelang:dutch) (crisis OR election OR earthquake OR conflict OR economy)", limit = 75 }

[[sources]]
name = "wikipedia-current-events"
kind = "wikipedia_events"
url = "https://en.wikipedia.org/api/rest_v1/page/html"
interval_min = 360

[[sources]]
name = "reliefweb"
kind = "reliefweb"
url = "https://api.reliefweb.int/v1/reports"
interval_min = 180
params = { appname = "vortex-personal", limit = 30 }

[[sources]]
name = "usgs"
kind = "usgs"
url = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson"
country = "US"
interval_min = 60

[[sources]]
name = "eonet"
kind = "eonet"
url = "https://eonet.gsfc.nasa.gov/api/v3/events"
interval_min = 180

# ── Statistiek / economie ────────────────────────────────────────────────────
[[sources]]
name = "worldbank-gdp-nl"
kind = "worldbank"
url = "https://api.worldbank.org/v2"
interval_min = 10080
params = { country = "NLD", indicator = "NY.GDP.MKTP.KD.ZG" }

[[sources]]
name = "eurostat-hicp"
kind = "eurostat"
url = "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
interval_min = 1440
params = { dataset = "prc_hicp_manr", filter = "&geo=NL&coicop=CP00" }

[[sources]]
name = "cbs-cpi"
kind = "cbs"
url = "https://opendata.cbs.nl/ODataApi/odata"
interval_min = 1440
params = { table = "83131NED", limit = 3 }

# ── Wetenschap en tech ───────────────────────────────────────────────────────
[[sources]]
name = "arxiv-ai"
kind = "arxiv"
url = "http://export.arxiv.org/api/query"
interval_min = 720
params = { query = "cat:cs.AI OR cat:cs.CL OR cat:cs.LG", limit = 50 }

[[sources]]
name = "hackernews"
kind = "hackernews"
url = "https://hacker-news.firebaseio.com/v0"
interval_min = 120
params = { limit = 30 }

# ── Entiteiten ───────────────────────────────────────────────────────────────
# Geen nieuwsbron: koppelt namen in bevestigde events aan Wikidata (Q-ID) vóór de KG-integratie.
[[sources]]
name = "wikidata"
kind = "wikidata"
url = "https://www.wikidata.org/w/api.php"
interval_min = 10080
params = { lang = "en" }
