# Opslagpaden. SSD = warm, HDD = koud. Aanpassen aan je schijfletters (zie VAULT/04-HARDWARE-EN-OPSLAG.md).
data_dir = "data"                       # SQLite, index (SSD) — relatief aan de repo of absoluut
models_dir = "D:/vortex-models"         # actieve modellen (SSD)
cold_dir = "D:/vortex-cold"             # ruwe data, archief, backups (HDD als je die hebt; geen schijf → data\cold)
hf_home = "D:/vortex-cold/hf"           # Hugging Face-cache (HDD)
llama_server = "C:/tools/llama.cpp/llama-server.exe"
worker_address = "127.0.0.1:50061"         # Python-worker (ingest/parsers): `just worker`
browser = ""                             # headless browser voor JS-pagina's (leeg = automatisch zoeken: Chrome/Edge/Chromium)
