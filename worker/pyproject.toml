[project]
name = "vortex-worker"
version = "0.1.0"
description = "Vortex Python ML-worker: ingest, parsers, training, datasets (gRPC naar de Rust-kern)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.28",
]

[project.optional-dependencies]
# Zwaar: alleen installeren waar nodig (W10 ingest, W13 training).
ingest = ["pymupdf>=1.24", "ebooklib>=0.18", "trafilatura>=1.12", "pyarrow>=17", "openpyxl>=3.1", "python-docx>=1.1", "pillow>=10"]
# Multimodaal (W16), CPU: OCR, spraak in/uit.
media = ["paddleocr>=2.8", "pytesseract>=0.3", "faster-whisper>=1.0", "kokoro>=0.9", "soundfile>=0.12", "pillow>=10"]
# Multimodaal op de GPU: beeldgeneratie en visuele retrieval.
media-gpu = ["torch", "diffusers>=0.30", "transformers", "accelerate", "colpali-engine>=0.3"]
# Neurale layers (W11): numpy-trainer + ONNX-export (licht). PyTorch wordt gebruikt als het er is.
layers = ["numpy>=1.26", "onnx>=1.16"]
# HF-datasets (W14.09): streamen + licentie uit de dataset-card.
hf = ["datasets>=3", "huggingface_hub>=0.24", "pyarrow>=17"]
train = ["torch", "transformers", "peft", "datasets", "huggingface_hub", "onnx", "numpy"]

[project.scripts]
vortex-worker = "vortex_worker.server:main"

[dependency-groups]
dev = ["grpcio-tools>=1.66", "pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vortex_worker"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/vortex_worker/gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/vortex_worker/gen"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
