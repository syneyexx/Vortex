[project]
name = "vortex-worker"
version = "0.1.0"
description = "Vortex Python ML-worker: ingest, parsers, training, datasets (gRPC naar de Rust-kern)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.28",
]

[project.optional-dependencies]
# Zwaar: alleen installeren waar nodig (W10 ingest, W13 training).
ingest = ["pymupdf>=1.24", "ebooklib>=0.18", "trafilatura>=1.12"]
train = ["torch", "transformers", "peft", "datasets", "huggingface_hub", "onnx"]

[project.scripts]
vortex-worker = "vortex_worker.server:main"

[dependency-groups]
dev = ["grpcio-tools>=1.66", "pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vortex_worker"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/vortex_worker/gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/vortex_worker/gen"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
