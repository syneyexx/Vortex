// Kern ⇄ GUI. Events met volgnummers; GUI hervat met from_seq na reconnect.
// Verbinding weg ≠ taak gestopt. Eigenaar: vortex-server.
syntax = "proto3";
package vortex.gui.v1;

import "vortex/common/v1/common.proto";

service GuiEvents {
  rpc Subscribe(SubscribeRequest) returns (stream Frame);
}

service GuiCommands {
  rpc SendMessage(SendMessageRequest) returns (SendMessageReply);
  rpc Stop(StopRequest) returns (StopReply);
  rpc SetSetting(SetSettingRequest) returns (SetSettingReply);
}

message SubscribeRequest {
  int64 from_seq = 1;     // 0 = snapshot + live
  string session_id = 2;  // leeg = alles
}

// Getypeerde frames.
message Frame {
  int64 seq = 1;
  string run_id = 2;
  oneof body {
    TextDelta text = 10;
    ToolStart tool_start = 11;
    ToolResult tool_result = 12;
    vortex.common.v1.ArtifactRef artifact = 13;
    Warning warning = 14;
    End end = 15;
    RunStatus status = 16;
    vortex.common.v1.Progress progress = 17;
  }
}

message TextDelta { string text = 1; }
message ToolStart { string tool_call_id = 1; string tool = 2; string summary = 3; }
message ToolResult { string tool_call_id = 1; bool ok = 2; string summary = 3; uint64 duration_ms = 4; }
message Warning { string code = 1; string message = 2; }
message End { string reason = 1; }
message RunStatus { vortex.common.v1.RunState state = 1; string detail = 2; }

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_ADAPTIVE = 1;
  MODE_QUICK = 2;
  MODE_DEEP = 3;
  MODE_RESEARCH = 4;
}

message SendMessageRequest {
  string session_id = 1;
  string text = 2;
  Mode mode = 3;
  string model_override = 4;
  repeated vortex.common.v1.ArtifactRef attachments = 5;
}
message SendMessageReply { string run_id = 1; string message_id = 2; }

message StopRequest { string run_id = 1; }
message StopReply { bool accepted = 1; }

message SetSettingRequest { string key = 1; string value_json = 2; bool apply_now = 3; }
message SetSettingReply { string config_version = 1; }
